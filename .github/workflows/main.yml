name: JAVIDSUB Auto Update

on:
  schedule:
    - cron: "0 * * * *" # اجرا هر یک ساعت
  workflow_dispatch:

jobs:
  update-sub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp

      - name: Run Merge & Health Check Script
        env:
          MY_SUBS_LIST: ${{ secrets.MY_SUBS_LIST }}
        run: python process.py

      - name: Push Results
        run: |
          git config --global user.name "JAVID-BOT"
          git config --global user.email "bot@javid.com"
          git add JAVIDSUB.txt JAVIDSUB_B64.txt
          git commit -m "Update & Health Check: $(date)" || exit 0
          git push
