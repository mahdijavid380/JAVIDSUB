name: JAVIDSUB Auto Update

on:
  schedule:
    - cron: "0 */4 * * *" # اجرا هر ۴ ساعت یک‌بار
  workflow_dispatch: # امکان اجرای دستی

permissions:
  contents: write

jobs:
  update-sub:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests python-v2ray

      # 🟢 این مرحله جدید اضافه شده است: کش کردن هسته Xray
      - name: Cache Xray Core
        uses: actions/cache@v4
        with:
          path: |
            vendor
            core_engine
          key: ${{ runner.os }}-xray-core-v1

      - name: Run Merge Script
        env:
          MY_SUBS_LIST: ${{ secrets.MY_SUBS_LIST }}
          MAX_OUTPUT: "2000"
          PYTHONUNBUFFERED: "1"
        run: python process.py

      - name: Upload Artifacts (اختیاری)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javidsub-configs
          path: JAVIDSUB.txt
          retention-days: 7

      - name: Push Results
        run: |
          git config --global user.name "JAVID-BOT"
          git config --global user.email "bot@javid.com"
          git add JAVIDSUB.txt
          git commit -m "Update: $(date -u)" || exit 0
          git push
